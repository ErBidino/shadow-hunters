<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<title>Shadow Hunters</title>

<!-- Leaflet (mappa) -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="preconnect" href="https://tile.openstreetmap.org" crossorigin />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
/* ============================================================
   SHADOW HUNTERS — UI iOS 17/18
   Design tokens: materiali, etichette, raggi, ombre, motion
   ============================================================ */
:root{
  /* materiali */
  --glass:            rgba(255,255,255,.68);
  --glass-strong:     rgba(255,255,255,.86);
  --glass-border:     rgba(255,255,255,.62);
  --sheet-bg:         rgba(250,250,252,.90);

  /* gerarchia etichette iOS */
  --text:             #1c1c1e;
  --text-2:           rgba(60,60,67,.60);
  --text-3:           rgba(60,60,67,.30);

  /* riempimenti e separatori */
  --fill:             rgba(120,120,128,.12);
  --fill-2:           rgba(120,120,128,.20);
  --separator:        rgba(60,60,67,.16);

  /* accenti semantici */
  --hot:              #ff3b30;   /* systemRed  → zona di calore */
  --hot-soft:         rgba(255,59,48,.12);
  --cool:             #007aff;   /* systemBlue → zona d'ombra  */
  --cool-soft:        rgba(0,122,255,.12);
  --gold:             #ffb800;   /* stelle */
  --green:            #34c759;   /* scuola */

  /* geometria */
  --r-xs: 12px; --r-sm: 16px; --r-md: 22px; --r-lg: 28px; --r-pill: 999px;

  /* ombre morbide e diffuse */
  --shadow-lift:  0 12px 34px rgba(0,0,0,.14), 0 2px 8px rgba(0,0,0,.05);
  --shadow-soft:  0 6px 20px rgba(0,0,0,.10), 0 1px 4px rgba(0,0,0,.04);
  --shadow-inner: inset 0 1px 0 rgba(255,255,255,.55);

  /* motion (spring iOS) */
  --spring: cubic-bezier(.32,.72,0,1);
  --pop:    cubic-bezier(.34,1.56,.64,1);

  --top-cluster: 118px;
}
@media (prefers-color-scheme: dark){
  :root{
    --glass:        rgba(28,28,30,.66);
    --glass-strong: rgba(44,44,46,.86);
    --glass-border: rgba(255,255,255,.14);
    --sheet-bg:     rgba(28,28,30,.92);
    --text:         #ffffff;
    --text-2:       rgba(235,235,245,.62);
    --text-3:       rgba(235,235,245,.32);
    --fill:         rgba(120,120,128,.24);
    --fill-2:       rgba(120,120,128,.36);
    --separator:    rgba(235,235,245,.18);
    --hot:          #ff453a;
    --cool:         #0a84ff;
    --shadow-lift:  0 12px 34px rgba(0,0,0,.5), 0 2px 8px rgba(0,0,0,.3);
    --shadow-soft:  0 6px 20px rgba(0,0,0,.4);
    --shadow-inner: inset 0 1px 0 rgba(255,255,255,.07);
  }
}

/* ---------- base ---------- */
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0;overscroll-behavior:none}
body{
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Inter","Helvetica Neue",system-ui,sans-serif;
  color:var(--text);background:#e9eaec;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
  text-rendering:optimizeLegibility;letter-spacing:-.01em;touch-action:manipulation;
}
button,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.sprite{position:absolute;width:0;height:0;overflow:hidden}
.ic{width:20px;height:20px;display:block;fill:currentColor;flex:none}
.ic-stroke{fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.vh{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}

/* ---------- glassmorphism ---------- */
.glass{
  background:var(--glass);
  -webkit-backdrop-filter:saturate(180%) blur(28px);
  backdrop-filter:saturate(180%) blur(28px);
  border:.5px solid var(--glass-border);
  box-shadow:var(--shadow-lift), var(--shadow-inner);
}
.glass-strong{
  background:var(--sheet-bg);
  -webkit-backdrop-filter:saturate(180%) blur(34px);
  backdrop-filter:saturate(180%) blur(34px);
  border:.5px solid var(--glass-border);
  box-shadow:var(--shadow-lift), var(--shadow-inner);
}
@supports not ((-webkit-backdrop-filter:blur(1px)) or (backdrop-filter:blur(1px))){
  .glass{background:var(--glass-strong)}
}

/* ============================================================
   MAPPA (livello 0, sotto la UI)
   ============================================================ */
#map{position:absolute;inset:0;z-index:0;background:#e9eaec}
.leaflet-container{font-family:inherit;background:#e9eaec}
body.armed #map{cursor:crosshair}
.leaflet-top.leaflet-right{top:calc(env(safe-area-inset-top,0px) + var(--top-cluster))}
.leaflet-control-zoom{border:0!important;border-radius:var(--r-xs)!important;overflow:hidden;box-shadow:var(--shadow-soft)!important}
.leaflet-control-zoom a{
  width:38px;height:38px;line-height:38px;font-size:20px;font-weight:500;
  color:var(--text);background:var(--glass-strong);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);
  border-bottom:.5px solid var(--separator);transition:background .2s
}
.leaflet-control-zoom a:hover{background:var(--fill)}
.leaflet-control-attribution{
  background:var(--glass)!important;-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);
  border-radius:var(--r-xs) 0 0 var(--r-xs);font-size:10px;color:var(--text-2);padding:2px 6px;box-shadow:none!important
}
.leaflet-control-attribution a{color:var(--text-2)}
.leaflet-popup-content-wrapper{
  border-radius:var(--r-sm);background:var(--glass-strong);-webkit-backdrop-filter:blur(24px);backdrop-filter:blur(24px);
  box-shadow:var(--shadow-lift);color:var(--text);border:.5px solid var(--glass-border)
}
.leaflet-popup-content{margin:12px 14px;font-size:13px;line-height:1.45}
.leaflet-popup-tip{background:var(--glass-strong)}
.leaflet-popup-close-button{color:var(--text-2)!important;padding:6px 6px 0 0!important}
/* le tile OSM sono "colorate": le desaturo per mantenere il look minimale iOS.
   Il filtro è solo sul pane delle tile → i marker restano vividi. */
.leaflet-tile-pane{filter:saturate(.72) contrast(.95) brightness(1.05)}
@media (prefers-color-scheme: dark){
  .leaflet-tile-pane{filter:invert(1) hue-rotate(180deg) brightness(.88) contrast(1.02) saturate(.75)}
}
body.map-failed #map::after{
  content:"🗺️";position:absolute;inset:0;display:grid;place-items:center;
  font-size:48px;opacity:.25;pointer-events:none
}

/* ============================================================
   CLUSTER SUPERIORE
   ============================================================ */
.ui-top{
  position:absolute;top:0;left:0;right:0;z-index:20;
  padding:calc(env(safe-area-inset-top,0px) + 10px) 12px 0;
  display:grid;gap:10px;justify-items:center;pointer-events:none
}
.ui-top>*{pointer-events:auto;width:100%;max-width:560px}
.top-row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{
  display:flex;align-items:center;gap:9px;padding:7px 14px 7px 8px;border-radius:var(--r-pill);
  font-size:14px;font-weight:700;letter-spacing:-.015em
}
.brand-mark{
  width:26px;height:26px;border-radius:9px;display:grid;place-items:center;font-size:14px;
  background:linear-gradient(160deg,#ffd60a,#ff9f0a);box-shadow:0 2px 6px rgba(255,159,10,.4)
}
.lang-wrap{position:relative;display:flex;align-items:center;gap:4px;padding:6px 10px 6px 12px;border-radius:var(--r-pill)}
.lang-wrap .ic{width:17px;height:17px;opacity:.65}
.lang-wrap .chev{width:14px;height:14px;opacity:.45;margin-left:-2px}
#langSel{
  appearance:none;-webkit-appearance:none;border:0;background:transparent;
  font-size:13px;font-weight:600;padding:2px;max-width:104px;text-overflow:ellipsis
}
#langSel:focus-visible{outline:2px solid var(--cool);outline-offset:2px;border-radius:6px}

/* segmented control iOS */
.segmented{position:relative;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;padding:3px;border-radius:var(--r-sm);background:var(--fill)}
.segmented .seg-ind{
  position:absolute;top:3px;left:3px;width:calc(50% - 3px);height:calc(100% - 6px);
  border-radius:13px;background:var(--glass-strong);box-shadow:0 3px 10px rgba(0,0,0,.14);
  transition:transform .38s var(--spring),opacity .26s ease
}
/* nessuna modalità scelta → nessuna "pillola" attiva (stato neutro) */
.segmented.modes[data-active=""] .seg-ind{opacity:0;transform:scale(.92)}
.segmented button{
  position:relative;z-index:1;display:flex;align-items:center;justify-content:center;gap:7px;
  padding:10px;border:0;background:transparent;border-radius:13px;
  font-size:14px;font-weight:600;color:var(--text-2);transition:color .22s
}
.segmented button:active{transform:scale(.98)}
.segmented button[aria-selected="true"],.segmented button[aria-pressed="true"]{color:var(--text)}
.segmented.cities{width:100%}
.segmented.cities[data-active="helsinki"] .seg-ind{transform:translateX(100%)}
.segmented .ic{width:17px;height:17px}

/* ============================================================
   CLUSTER INFERIORE
   ============================================================ */
.ui-bottom{
  position:absolute;left:0;right:0;bottom:0;z-index:20;
  padding:0 12px calc(env(safe-area-inset-bottom,0px) + 12px);
  display:grid;gap:10px;justify-items:center;pointer-events:none
}
.ui-bottom>*{pointer-events:auto;width:100%;max-width:560px}
.legend{
  display:flex;align-items:center;justify-content:center;gap:14px;padding:7px 14px;
  border-radius:var(--r-pill);font-size:11px;font-weight:500;color:var(--text-2);width:auto
}
.legend span{display:inline-flex;align-items:center;gap:5px}
.dot{width:8px;height:8px;border-radius:var(--r-pill);display:inline-block}
.dot.hot{background:var(--hot)} .dot.cool{background:var(--cool)} .dot.school{background:var(--green)}

.mode-card{padding:10px;border-radius:var(--r-md);display:grid;gap:9px;transition:box-shadow .25s}
.mode-card[data-active="hot"]{box-shadow:var(--shadow-lift), 0 0 0 1px var(--hot-soft), var(--shadow-inner)}
.mode-card[data-active="cool"]{box-shadow:var(--shadow-lift), 0 0 0 1px var(--cool-soft), var(--shadow-inner)}
.segmented.modes[data-active="hot"] button#btnHot{color:var(--hot)}
.segmented.modes[data-active="cool"] button#btnCool{color:var(--cool)}
.segmented.modes[data-active="cool"] .seg-ind{transform:translateX(100%)}
.hint{margin:0;text-align:center;font-size:12px;line-height:1.35;color:var(--text-2);padding:0 6px}
.hint b{color:var(--text);font-weight:650}

.toolbar{display:flex;align-items:center;gap:4px;padding:7px 9px;border-radius:var(--r-md)}
.counter{display:flex;align-items:center;gap:7px;padding:7px 12px;border-radius:var(--r-sm);background:var(--fill);font-size:13px;font-weight:600}
.counter .ic{width:16px;height:16px;color:var(--text-2)}
.counter b{font-variant-numeric:tabular-nums;font-size:15px;font-weight:700}
.counter small{font-size:11px;font-weight:500;color:var(--text-2)}
.toolbar .spacer{flex:1}
.tb{
  display:flex;flex-direction:column;align-items:center;gap:3px;min-width:60px;
  padding:6px 8px;border:0;border-radius:var(--r-xs);background:transparent;
  font-size:10px;font-weight:600;color:var(--text-2);
  transition:background .18s,color .18s,transform .18s var(--pop)
}
.tb .ic{width:23px;height:23px}
.tb:hover{background:var(--fill);color:var(--text)}
.tb:active{transform:scale(.94);background:var(--fill-2)}
.tb.danger{color:var(--hot)}
.tb.tint{color:var(--cool)}

/* ============================================================
   BOTTOM SHEET + drag-to-dismiss
   ============================================================ */
.sheet-wrap{
  position:fixed;inset:0;z-index:40;display:grid;align-items:end;justify-items:center;
  pointer-events:none;visibility:hidden;transition:visibility 0s linear .5s
}
.sheet-wrap.is-open{pointer-events:auto;visibility:visible;transition-delay:0s}
.sheet-backdrop{position:absolute;inset:0;background:rgba(0,0,0,.3);opacity:0;
  -webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);transition:opacity .34s ease}
.is-open .sheet-backdrop{opacity:1}
.sheet{
  position:relative;width:100%;max-width:520px;max-height:88vh;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:6px 18px calc(18px + env(safe-area-inset-bottom,0px));
  border-radius:var(--r-lg) var(--r-lg) 0 0;
  transform:translateY(102%);transition:transform .5s var(--spring);will-change:transform
}
.is-open .sheet{transform:none}
.sheet.dragging{transition:none}
.grabber{padding:8px 0 12px;display:flex;justify-content:center;touch-action:none;cursor:grab}
.grabber:active{cursor:grabbing}
.grabber span{width:38px;height:5px;border-radius:var(--r-pill);background:var(--text-3)}

.sheet-head{display:flex;align-items:flex-start;gap:12px}
.badge{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;flex:none;
  background:var(--fill);color:var(--text);transition:background .25s,color .25s}
.badge .ic{width:23px;height:23px}
.sheet[data-type="hot"] .badge{background:var(--hot-soft);color:var(--hot)}
.sheet[data-type="cool"] .badge{background:var(--cool-soft);color:var(--cool)}
.sheet-kicker{margin:0 0 2px;font-size:12px;font-weight:600;letter-spacing:.02em;text-transform:uppercase;color:var(--text-2)}
.sheet-head h2{margin:0;font-size:19px;font-weight:700;letter-spacing:-.02em}
.coords{margin:3px 0 0;font-size:11.5px;color:var(--text-3)}
.icon-btn{width:32px;height:32px;border-radius:var(--r-pill);border:0;background:var(--fill);color:var(--text-2);
  display:grid;place-items:center;flex:none;transition:background .2s,transform .18s var(--pop)}
.icon-btn:hover{background:var(--fill-2);color:var(--text)}
.icon-btn:active{transform:scale(.9)}
.icon-btn .ic{width:16px;height:16px}

.field{margin-top:18px}
.label{display:block;font-size:13px;font-weight:600;margin:0 0 8px}
.label .muted{font-weight:500;color:var(--text-2)}
.stars{display:flex;gap:4px}
.star{border:0;background:transparent;padding:2px;color:var(--text-3);transition:color .2s,transform .2s var(--pop)}
.star .ic{width:32px;height:32px}
.star.on{color:var(--gold)}
.star:active{transform:scale(1.2)}
/* valutazione obbligatoria: stato di errore + shake */
.stars.error{animation:shake .42s cubic-bezier(.36,.07,.19,.97)}
.stars.error .star{color:var(--hot)}
@keyframes shake{
  10%,90%{transform:translateX(-2px)} 20%,80%{transform:translateX(4px)}
  30%,50%,70%{transform:translateX(-6px)} 40%,60%{transform:translateX(6px)}
}
#ratingText.error{color:var(--hot);font-weight:600}
.btn.primary.is-locked{opacity:.45;box-shadow:none}
.footnote{margin:6px 0 0;font-size:11.5px;color:var(--text-2)}
.footnote.right{text-align:right}
.footnote.center{text-align:center;margin-top:12px}
#noteInput{
  width:100%;min-height:78px;resize:none;padding:12px 14px;border-radius:var(--r-sm);
  border:.5px solid var(--separator);background:var(--fill);color:var(--text);
  font-size:15px;line-height:1.4;transition:box-shadow .2s,border-color .2s
}
#noteInput::placeholder{color:var(--text-3)}
#noteInput:focus{outline:none;border-color:transparent;box-shadow:0 0 0 3px var(--cool-soft),0 0 0 .5px var(--cool)}

.sheet-actions{display:grid;grid-template-columns:1fr 1.25fr;gap:10px;margin-top:20px}
.btn{min-height:50px;border:0;border-radius:var(--r-sm);font-size:16px;font-weight:650;letter-spacing:-.015em;
  transition:transform .18s var(--pop),filter .2s,background .2s}
.btn:active{transform:scale(.97)}
.btn.ghost{background:var(--fill);color:var(--text)}
.btn.ghost:hover{background:var(--fill-2)}
.btn.primary{color:#fff;background:linear-gradient(180deg,var(--accent-1),var(--accent-2));box-shadow:0 10px 22px var(--accent-shadow)}
.btn.primary:hover{filter:brightness(1.06)}
.sheet[data-type="hot"]{--accent-1:#ff7a6e;--accent-2:#ff3b30;--accent-shadow:rgba(255,59,48,.34)}
.sheet[data-type="cool"]{--accent-1:#4aa3ff;--accent-2:#007aff;--accent-shadow:rgba(0,122,255,.32)}
@media (prefers-color-scheme: dark){
  .sheet[data-type="hot"]{--accent-1:#ff6961;--accent-2:#ff453a}
  .sheet[data-type="cool"]{--accent-1:#409cff;--accent-2:#0a84ff}
}

/* ============================================================
   TOAST
   ============================================================ */
.toast{position:fixed;left:50%;z-index:60;top:calc(env(safe-area-inset-top,0px) + var(--top-cluster));
  transform:translateX(-50%) translateY(-14px) scale(.96);opacity:0;pointer-events:none;
  transition:opacity .26s ease,transform .34s var(--spring)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0) scale(1)}
.toast .cap{display:block;max-width:86vw;padding:10px 16px;border-radius:var(--r-pill);
  background:rgba(28,28,30,.86);color:#fff;font-size:13px;font-weight:550;
  -webkit-backdrop-filter:blur(22px);backdrop-filter:blur(22px);
  box-shadow:var(--shadow-lift);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (prefers-color-scheme: dark){.toast .cap{background:rgba(240,240,245,.92);color:#000}}

/* ============================================================
   RESPONSIVE
   ============================================================ */
@media (min-width:640px){
  :root{--top-cluster:126px}
  .brand{font-size:15px}
  .sheet{border-radius:var(--r-lg);margin-bottom:28px}
  .tb{min-width:72px;font-size:11px}
  .hint{font-size:12.5px}
}
@media (min-width:1024px){.ui-top,.ui-bottom{padding-left:20px;padding-right:20px}}

:focus-visible{outline:2.5px solid var(--cool);outline-offset:3px;border-radius:10px}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;transition-duration:.001ms!important}
}
</style>
</head>

var lang = "it";
function T(key, params) {
  var s = (I18N[lang] && I18N[lang][key]) || I18N.it[key] || key;
  if (params) for (var k in params) s = s.split("{" + k + "}").join(params[k]);
  return s;
}

/* ---------------- COSTANTI ---------------- */
var CITIES = {
  rome:     { nameKey: "locRome",     lat: 41.8214, lng: 12.4811, zoom: 16 },
  helsinki: { nameKey: "locHelsinki", lat: 60.1741, lng: 24.9221, zoom: 16 }
};
var COLORS = {
  hot:  { fill: "#FF3B30", emoji: "🔴", nameKey: "typeHot",  icon: "i-sun" },
  cool: { fill: "#007AFF", emoji: "🔵", nameKey: "typeCool", icon: "i-umbrella" }
};

/* ---------------- HAPTIC + TOAST ---------------- */
function tap() { if (navigator.vibrate) { try { navigator.vibrate(8); } catch (e) {} } }

var toastTimer = null;
function toast(msg, ms) {
  var el = document.getElementById("toast");
  document.getElementById("toastText").textContent = msg;
  el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { el.classList.remove("show"); }, ms || 1900);
}

/* ---------------- I18N ---------------- */
function applyLang(l) {
  lang = I18N[l] ? l : "it";
  try { localStorage.setItem("shadowLang", lang); } catch (e) {}
  document.getElementById("langSel").value = lang;
  document.title = T("docTitle");
  var nodes = document.querySelectorAll("[data-i18n]");
  for (var i = 0; i < nodes.length; i++) nodes[i].textContent = T(nodes[i].getAttribute("data-i18n"));
  var phs = document.querySelectorAll("[data-i18n-ph]");
  for (var j = 0; j < phs.length; j++) phs[j].setAttribute("placeholder", T(phs[j].getAttribute("data-i18n-ph")));
  var ars = document.querySelectorAll("[data-i18n-aria]");
  for (var k = 0; k < ars.length; k++) ars[k].setAttribute("aria-label", T(ars[k].getAttribute("data-i18n-aria")));
  refreshModeUI();
  renderRatingText();
  updateCTA();
  if (pending) updateSheetInfo();
}
function setLang(l) { applyLang(l); toast(T("toastLang"), 1300); }

/* ---------------- MAPPA + BASEMAP ----------------
   Provider KEYLESS. Nota: CARTO serve ora tile con watermark "API KEY REQUIRED",
   quindi si usa OpenStreetMap con fallback automatico su altri mirror. */
var map = L.map("map", { zoomControl: false }).setView([CITIES.rome.lat, CITIES.rome.lng], CITIES.rome.zoom);
L.control.zoom({ position: "topright" }).addTo(map);
map.attributionControl.setPosition("topright");

var ATTR = '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors';
var TILE_PROVIDERS = [
  "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
  "https://{s}.tile.openstreetmap.fr/osmfr/{z}/{x}/{y}.png",
  "https://tile.openstreetmap.de/{z}/{x}/{y}.png"
];
var providerIndex = 0, tiles = null, tileErrors = 0, tilesLoaded = 0, watchdog = null;

function nextProvider() {
  if (providerIndex < TILE_PROVIDERS.length - 1) {
    providerIndex++;
    tileErrors = 0;
    addTiles(providerIndex);
    toast(T("toastTileFallback"), 1800);
    return true;
  }
  document.body.classList.add("map-failed");
  toast(T("toastMapFailed"), 3200);
  return false;
}

function addTiles(i) {
  if (tiles) map.removeLayer(tiles);
  tilesLoaded = 0;
  tiles = L.tileLayer(TILE_PROVIDERS[i], { maxZoom: 19, attribution: ATTR });
  tiles.on("tileload", function () {
    tilesLoaded++;
    if (watchdog) { clearTimeout(watchdog); watchdog = null; }
  });
  tiles.on("tileerror", function () {
    tileErrors++;
    if (tileErrors >= 4) nextProvider();     // 4 errori → provider successivo
  });
  tiles.addTo(map);
  // watchdog: se dopo 6s non è arrivata nessuna tile, prova il provider successivo
  if (watchdog) clearTimeout(watchdog);
  watchdog = setTimeout(function () {
    watchdog = null;
    if (tilesLoaded === 0) nextProvider();
  }, 6000);
}
addTiles(0);

// iOS/Safari: la mappa a volte viene misurata prima che il layout sia pronto
function fixMapSize() { try { map.invalidateSize(); } catch (e) {} }
setTimeout(fixMapSize, 250);
setTimeout(fixMapSize, 900);
window.addEventListener("resize", fixMapSize);
window.addEventListener("orientationchange", function () { setTimeout(fixMapSize, 350); });
document.addEventListener("visibilitychange", function () { if (!document.hidden) fixMapSize(); });

var dataLayer = L.layerGroup().addTo(map);

L.circleMarker([CITIES.helsinki.lat, CITIES.helsinki.lng], { radius: 7, color: "#fff", weight: 2.5, fillColor: "#34C759", fillOpacity: 1 })

  document.getElementById("btnRome").setAttribute("aria-selected", key === "rome" ? "true" : "false");
  document.getElementById("btnHelsinki").setAttribute("aria-selected", key === "helsinki" ? "true" : "false");
  map.flyTo([CITIES[key].lat, CITIES[key].lng], CITIES[key].zoom, { duration: 1.15 });
  toast(T("toastCity", { name: cityLabel(key) }));
}
function goRome() { goCity("rome"); }
function goHelsinki() { goCity("helsinki"); }

/* ---------------- MODALITÀ ---------------- */
function typeName(t) { return T(COLORS[t].nameKey); }

function refreshModeUI() {
  var active = mode || "";
  document.getElementById("modeSeg").setAttribute("data-active", active);
  document.getElementById("modeCard").setAttribute("data-active", active);
  document.getElementById("btnHot").setAttribute("aria-pressed", mode === "hot" ? "true" : "false");
  document.getElementById("btnCool").setAttribute("aria-pressed", mode === "cool" ? "true" : "false");
  document.body.classList.toggle("armed", !!mode);
  var hint = document.getElementById("hint");
  if (mode === "hot") hint.innerHTML = T("hintHot");
  else if (mode === "cool") hint.innerHTML = T("hintCool");
  else hint.textContent = T("hintDefault");
}

function toggleMode(m) {
  mode = (mode === m) ? null : m;
  refreshModeUI();
  if (!mode && pending) cancelPending();
}

/* ---------------- SELEZIONE MAPPA ---------------- */
map.on("click", function (e) {
  if (!mode) { toast(T("toastChooseFirst"), 2000); return; }
  setPending(e.latlng.lat, e.latlng.lng);
});

function setPending(lat, lng) {
  // scheda chiusa = nuovo punto → azzera stelle e nota (non quando si sposta il punto)
  var fresh = !document.getElementById("sheetWrap").classList.contains("is-open");
  if (fresh) resetForNewPoint();
  pending = { lat: lat, lng: lng };
  if (previewMarker) map.removeLayer(previewMarker);
  previewMarker = L.circleMarker([lat, lng], {
    radius: 15, color: "#fff", weight: 3,
    fillColor: COLORS[mode].fill, fillOpacity: 0.5
  }).addTo(map);
  updateSheetInfo();
  openSheet();
  toast(T("toastPreview"), 2200);
}

function updateSheetInfo() {
  document.getElementById("sheet").setAttribute("data-type", mode);
  document.getElementById("sheetBadge").innerHTML =
    '<svg class="ic"><use href="#' + COLORS[mode].icon + '"/></svg>';
  document.getElementById("sheetType").textContent = typeName(mode);
  document.getElementById("pendingCoords").textContent =
    "Lat " + pending.lat.toFixed(5) + " · Lng " + pending.lng.toFixed(5) + " · " + T("sheetMoveHint");
}

function openSheet() { document.getElementById("sheetWrap").classList.add("is-open"); }
function closeSheet() { document.getElementById("sheetWrap").classList.remove("is-open"); }

/* ---------------- CONFERMA / ANNULLA ---------------- */
function confirmPending() {
  if (!pending) return;
  if (rating === 0) { showRatingError(); return; }   // ⭐ valutazione OBBLIGATORIA
  var note = document.getElementById("noteInput").value.trim();
  idCounter += 1;
  var rec = { id: idCounter, type: mode, lat: pending.lat, lng: pending.lng, ts: new Date(), note: note, rating: rating };
  points.push(rec);

  var marker = L.circleMarker([rec.lat, rec.lng], {
    radius: 11, color: "#fff", weight: 2.5, fillColor: COLORS[rec.type].fill, fillOpacity: 1
  });
  marker.bindPopup(popupHtml(rec));
  marker.addTo(dataLayer);
  rec.marker = marker;

  if (previewMarker) { map.removeLayer(previewMarker); previewMarker = null; }
  pending = null;
  closeSheet();
  updateCount();
  toast(T("toastSaved", { type: typeName(rec.type) }));
}

function cancelPending() {
  if (previewMarker) { map.removeLayer(previewMarker); previewMarker = null; }
  pending = null;
  closeSheet();
}

function popupHtml(rec) {
  var html = "<div style='min-width:160px'>" +
    "<b>" + COLORS[rec.type].emoji + " " + typeName(rec.type) + "</b><br/>" +
    "<span style='color:var(--text-2);font-size:11px'>Lat " + rec.lat.toFixed(5) + " · Lng " + rec.lng.toFixed(5) +
    "<br/>" + fmtTS(rec.ts) + "</span>";
  if (rec.rating > 0) {
    html += "<br/><span style='color:#FFB800;letter-spacing:1px'>" + stars(rec.rating) +
            "</span> <span style='color:var(--text-2);font-size:11px'>" + rec.rating + "/5</span>";
  }
  if (rec.note) html += "<br/><span style='font-size:12px'>" + esc(rec.note) + "</span>";
  html += "<br/><button onclick='removePoint(" + rec.id + ")' style='margin-top:8px;cursor:pointer;" +
          "background:rgba(255,59,48,.12);color:#FF3B30;border:0;border-radius:999px;padding:5px 13px;" +
          "font-size:12px;font-weight:600'>" + T("popupRemove") + "</button></div>";
  return html;
}

function removePoint(id) {
  for (var i = 0; i < points.length; i++) {
    if (points[i].id === id) {
      dataLayer.removeLayer(points[i].marker);
      points.splice(i, 1);
      updateCount();
      toast(T("toastRemoved"));
      return;
    }
  }
}

/* ---------------- VALUTAZIONE ---------------- */
function setRating(v) {
  rating = (rating === v) ? 0 : v;
  var st = document.querySelectorAll(".star");
  for (var i = 0; i < st.length; i++) st[i].classList.toggle("on", i < rating);
  clearRatingError();
  renderRatingText();
  updateCTA();
}

function renderRatingText() {
  document.getElementById("ratingText").textContent =
    rating > 0 ? T("ratingFull", { v: rating, w: T("rat" + rating) }) : T("ratingPick");
}

/* ---- stato della valutazione obbligatoria ---- */
function updateCTA() {
  var b = document.getElementById("confirmBtn");
  if (b) b.classList.toggle("is-locked", rating === 0);
}
function clearRatingError() {
  document.getElementById("stars").classList.remove("error");
  document.getElementById("ratingText").classList.remove("error");
}
function showRatingError() {
  var st = document.getElementById("stars");
  st.classList.remove("error");
  void st.offsetWidth;                       // reflow → riavvia l'animazione shake
  st.classList.add("error");
  var rt = document.getElementById("ratingText");
  rt.classList.add("error");
  rt.textContent = T("toastRatingRequired");
  toast(T("toastRatingRequired"), 2400);
  tap();
}
function resetForNewPoint() {
  rating = 0;
  var st = document.querySelectorAll(".star");
  for (var i = 0; i < st.length; i++) st[i].classList.remove("on");
  clearRatingError();
  renderRatingText();
  updateCTA();
  var n = document.getElementById("noteInput");
  n.value = "";
  document.getElementById("noteCount").textContent = "0";
}
function stars(n) {
  var s = "";
  for (var i = 0; i < 5; i++) s += (i < n) ? "★" : "☆";
  return s;
}

document.getElementById("noteInput").addEventListener("input", function () {
  document.getElementById("noteCount").textContent = this.value.length;
});

function updateCount() { document.getElementById("count").textContent = points.length; }

/* ---------------- SVUOTA ---------------- */
function clearAll() {
  if (points.length === 0) { toast(T("toastClearEmpty")); return; }
  if (!confirm(T("confirmClear", { n: points.length }))) return;
  dataLayer.clearLayers();
  points = [];
  updateCount();
  toast(T("toastCleared"));
}

/* ---------------- CSV / EXPORT ---------------- */
function buildCSV() {
  var header = "Type,Latitude,Longitude,Timestamp,Note,Rating";
  var rows = points.map(function (p) {
    return (p.type === "hot" ? "Hot" : "Cool") + "," +
           p.lat.toFixed(6) + "," + p.lng.toFixed(6) + "," +
           csvField(fmtTS(p.ts)) + "," + csvField(p.note || "") + "," +
           (p.rating > 0 ? p.rating : "");
  });
  return "\uFEFF" + [header].concat(rows).join("\r\n");
}
function csvField(v) { return '"' + String(v).replace(/"/g, '""') + '"'; }
function fileName() {
  var d = new Date();
  return "shadow-hunters-" + currentCity + "-" + d.getFullYear() + "-" +
         pad(d.getMonth() + 1) + "-" + pad(d.getDate()) + ".csv";
}
function isMobileDevice() {
  var ua = navigator.userAgent || "";
  var coarse = window.matchMedia && window.matchMedia("(pointer: coarse)").matches;
  return /Android|iPhone|iPad|iPod|Mobile|Windows Phone/i.test(ua) || (navigator.maxTouchPoints > 0 && coarse);
}

function exportCSV() {
  if (points.length === 0) { toast(T("toastNoDataExport"), 2400); return; }
  var csv = buildCSV(), name = fileName();
  var file = new File([csv], name, { type: "text/csv;charset=utf-8" });
  var cityShort = cityLabel(currentCity).split(" ")[0];

  if (isMobileDevice() && navigator.canShare && navigator.canShare({ files: [file] })) {
    navigator.share({
      files: [file], title: T("shareTitle"),
      text: T("shareText", { n: points.length, city: cityShort.toUpperCase() })
    }).then(function () { toast(T("toastShared")); })
      .catch(function (err) {
        if (err && err.name === "AbortError") toast(T("toastShareAbort"));
        else downloadAnchor(csv, name);
      });
    return;
  }
  downloadAnchor(csv, name);
}

function downloadAnchor(csv, name) {
  try {
    var blob = new Blob([csv], { type: "text/csv;charset=utf-8" });
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = name; a.rel = "noopener";
    document.body.appendChild(a); a.click();
    setTimeout(function () { document.body.removeChild(a); URL.revokeObjectURL(a.href); }, 400);
    toast(T("toastDownloaded", { name: name }));
  } catch (e) {
    var w = window.open("data:text/csv;charset=utf-8," + encodeURIComponent(csv), "_blank");
    if (!w) copyText(csv, T("toastFallbackCopy"));
  }
}

function copyCSV() {
  if (points.length === 0) { toast(T("toastNoDataCopy")); return; }
  copyText(buildCSV(), T("toastCopied"));
}
function copyText(text, okMsg) {
  function done() { toast(okMsg); }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(done).catch(function () { legacyCopy(text); done(); });
  } else { legacyCopy(text); done(); }
}
function legacyCopy(text) {
  var ta = document.createElement("textarea");
  ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
  document.body.appendChild(ta); ta.focus(); ta.select();
  try { document.execCommand("copy"); } catch (e) {}
  document.body.removeChild(ta);
}

/* ---------------- DRAG-TO-DISMISS ---------------- */
(function initDrag() {
  var sheet = document.getElementById("sheet");
  var handle = document.getElementById("grabber");
  var startY = 0, dy = 0, dragging = false;

  handle.addEventListener("pointerdown", function (e) {
    dragging = true; startY = e.clientY; dy = 0;
    sheet.classList.add("dragging");
    try { handle.setPointerCapture(e.pointerId); } catch (err) {}
  });
  handle.addEventListener("pointermove", function (e) {
    if (!dragging) return;
    dy = Math.max(0, e.clientY - startY);
    sheet.style.transform = "translateY(" + dy + "px)";
  });
  function end() {
    if (!dragging) return;
    dragging = false;
    sheet.classList.remove("dragging");
    sheet.style.transform = "";
    if (dy > 96) cancelPending();
  }
  handle.addEventListener("pointerup", end);
  handle.addEventListener("pointercancel", end);
})();

/* ---------------- UTILITY ---------------- */
function fmtTS(ts) {
  return pad(ts.getDate()) + "/" + pad(ts.getMonth() + 1) + "/" + ts.getFullYear() +
         " " + pad(ts.getHours()) + ":" + pad(ts.getMinutes()) + ":" + pad(ts.getSeconds());
}
function pad(n) { return (n < 10 ? "0" : "") + n; }
function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }

/* ---------------- GLOBALI (attributi onclick) ---------------- */
window.setLang = setLang;
window.goRome = goRome;
window.goHelsinki = goHelsinki;
window.toggleMode = toggleMode;
window.setRating = setRating;
window.confirmPending = confirmPending;
window.cancelPending = cancelPending;
window.removePoint = removePoint;
window.clearAll = clearAll;
window.exportCSV = exportCSV;
window.copyCSV = copyCSV;

/* ---------------- AVVIO ---------------- */
(function init() {
  var stored = null;
  try { stored = localStorage.getItem("shadowLang"); } catch (e) {}
  applyLang(stored && I18N[stored] ? stored : "it");
  refreshModeUI();
  renderRatingText();
  updateCTA();
  updateCount();
  goCity("rome");
})();
</script>
